name: Deploy Crave App to GitHub Pages

on:
  push:
    branches: [claude/tabletop-treats-rebuild-5IDyy, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crave-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: crave-app

      - name: Build
        run: npm run build
        working-directory: crave-app

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: crave-app/dist
          force_orphan: true
